# Production, on the box. One service: PostgreSQL and the tunnel belong to
# cg1618-apps/platform, whose project runs them on the network this one joins.
#
# At the repository root because compose takes its project directory from the
# compose file's own location and loads .env from there.

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: food-app:local
    restart: unless-stopped
    logging:
      # Docker's default json-file driver has NO max-size: the file grows until
      # the disk is full, and on this box that is the shared PostgreSQL and
      # every hostname going down together. Every service in the platform's
      # compose project declares the same three values; see the platform's
      # docs/logging.md.
      #
      # This bounds a buffer, not retention. A compose up that recreates this
      # container discards its log whatever the size - what is meant to survive
      # goes to the collector.
      #
      # Quoted, both: max-file as a YAML integer is rejected at start.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      PORT: 8001
    networks:
      cg1618:
        # The generated ingress routes food.cg1618.com to
        # http://food-app:8001. Changing this alias without changing apps.yml
        # is a 502 with both files looking correct on their own.
        aliases:
          - food-app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: entrypoint.sh runs the migrations before uvicorn binds, and a
      # short start_period would restart a container that is migrating
      # correctly.
      start_period: 120s
    # No depends_on: PostgreSQL is in another compose project and compose
    # cannot order across them. restart: unless-stopped is what covers a cold
    # boot - the container exits when it cannot reach the database, and docker
    # restarts it until it can.

networks:
  cg1618:
    external: true
