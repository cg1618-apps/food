name: Tests

# Pull requests and the merge queue, and ubuntu-latest only. The self-hosted
# runner is a machine in a house and every repository in this organisation is
# public; a fork's pull request running on it is the standard catastrophe. No
# pull_request-triggered job may ever name it.
#
# How much of the backend suite runs depends on the event (the platform's
# docs/registry.md, "What runs when"). `dev` merges through a merge queue, so
# the `merge_group` run - `dev` plus everything queued ahead - is what tests
# the tree that lands, and it runs the full suite; so does a release pull
# request into `main`. A pull request into `dev` runs the fast tier its own
# changes call for (scripts/pr_tests.py). It stays ONE job named `test`, so
# `test` remains the single required check whatever the event.
on:
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Every test run creates and drops its own databases on this server
      # (tests/databases.py), here exactly as on a laptop. ubuntu-latest
      # ships PostgreSQL but does not run it, so without this service the
      # database tests error rather than skipping. It is declared on every
      # run; only the steps below decide whether anything uses it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The runner has no .env, so app/config.py would fall back to its own
      # defaults - user `food` with an empty password - and authentication
      # would fail even with the service healthy. Throwaway values for a
      # throwaway database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food
      APP_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every branch: the base of the pull request
          # for the diff below, and `origin/main`, which the release round
          # trip (tests/migrations/test_migration_round_trip.py) downgrades
          # to. A shallow clone holds only the merge commit.
          fetch-depth: 0

      # A pull request that changes only documentation skips everything below
      # and still reports `test` as passed. Not a workflow-level paths-ignore:
      # that leaves the required check unreported, and an unreported required
      # check blocks the merge for ever. Documentation is `docs/**` and any
      # `*.md`; one other file anywhere runs the whole job. An empty diff runs
      # it too, so the fast path is only taken on positive evidence.
      - name: Decide whether anything but documentation changed
        id: changes
        env:
          # A merge-queue run has no pull_request payload; its base and head
          # are the merge group's. Without the fallback the diff would be
          # empty, which runs the whole job - safe, but never the fast path.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "Documentation only: every other step is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      # `git ls-files` reads the index and has twice reported 100755 while the
      # COMMIT held 100644. core.fileMode is false on both development
      # machines, so the bit is never picked up from disk and a hook committed
      # without it fails on the box with `Permission denied` and nowhere else.
      # This reads the commit, which is the only thing that answers.
      - name: The migration hook must be executable in the commit
        if: steps.changes.outputs.code == 'true'
        run: |
          mode=$(git ls-tree HEAD -- deploy/migrations | awk '{print $1}')
          echo "deploy/migrations is $mode"
          test "$mode" = "100755"

      # The mirror of the assertion above, and the reason both exist: same
      # mechanism, different expected value. deploy/gated-paths is DATA - the
      # write prefixes the platform's Access policy covers - and nothing execs
      # it, so none of the executable-bit machinery applies. A copy-paste that
      # gave it 100755 would look consistent with its neighbour and be wrong.
      - name: The gated-paths file must be committed as data
        if: steps.changes.outputs.code == 'true'
        run: |
          mode=$(git ls-tree HEAD -- deploy/gated-paths | awk '{print $1}')
          echo "deploy/gated-paths is $mode"
          test "$mode" = "100644"
          ! grep -qP '\r' deploy/gated-paths

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.code == 'true'
        with:
          # Same interpreter as the runtime image (dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        if: steps.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt

      # Two migrations parented on the same revision merge cleanly in git and
      # only collide in Alembic's revision graph. In a merge-queue run that is
      # the combination being tested, and this says so in seconds. Needs no
      # database: `heads` reads the revision files.
      - name: One Alembic head
        if: steps.changes.outputs.code == 'true'
        run: |
          heads=$(alembic heads)
          echo "$heads"
          if [ "$(echo "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::More than one Alembic head. Reparent the newer revision's down_revision onto the other head."
            exit 1
          fi

      - name: Lint backend
        if: steps.changes.outputs.code == 'true'
        run: ruff check .

      - name: Lint shell scripts
        if: steps.changes.outputs.code == 'true'
        run: shellcheck deploy/migrations entrypoint.sh

      # The full suite in the merge queue and on a release into main; on a
      # pull request into dev, the selection scripts/pr_tests.py prints - the
      # unit tier, the test files it touches, and the migration guards and its
      # own revisions' tests when it touches alembic/ or app/models/ (or FULL,
      # when it changes the harness, the dependencies or this workflow).
      - name: Run the tests
        if: steps.changes.outputs.code == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "dev" ]; then
            selection=$(python scripts/pr_tests.py "$BASE" "$HEAD")
          else
            selection=FULL
          fi
          echo "$selection"
          if [ "$selection" = "FULL" ]; then
            python -m pytest tests/ -q -p no:cacheprovider
          else
            # shellcheck disable=SC2086 # one path per line, none with spaces
            python -m pytest -q -p no:cacheprovider $selection
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Run the frontend tests
        if: steps.changes.outputs.code == 'true'
        run: npm test
        working-directory: frontend

      # dockerfile builds the frontend, so without this a bundle that does not
      # compile is found by the deploy rather than by the pull request.
      - name: Build the frontend
        if: steps.changes.outputs.code == 'true'
        run: npm run build
        working-directory: frontend
